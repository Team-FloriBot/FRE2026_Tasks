coverage_planner:
  ros__parameters:
    # 2D Koordinaten des Feldes als flache Liste [x1, y1, x2, y2, x3, y3, ...]
    # Beispielhaft ein 10x10 Meter Feld
    polygon_coords: [0.0, 0.0, 10.0, 0.0, 10.0, 10.0, 0.0, 10.0]
    
    # Roboter Parameter
    operating_width: 0.5  # Die effektive Arbeitsbreite in Metern
    robot_width: 0.6      # Die physische Breite des Roboters in Metern
    turn_radius: 1.0      # Minimaler Wenderadius für Dubins-Kurven (für Kinematik entscheidend)
    
    # Feld Parameter
    headland_width: 1.5   # Breite des Vorgewendes zum Wenden in Metern
    swath_angle_deg: 0.0  # Winkel der Fahrgassen in Grad (0 = parallel zur X-Achse)
    
    # Routing
    routing_pattern: "boustrophedon"  # Unterstützt: "boustrophedon", "snake"
    frame_id: "map"                   # TF Frame, in dem das Polygon definiert ist