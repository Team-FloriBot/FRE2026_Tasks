pan_tilt_targeting:
  ros__parameters:
    # Input settings
    global_target_topic: "/global_target"
    active_markers_topic: "/active_markers"
    
    # Output settings
    target_command_topic: "/target_command"
    
    # Pan-Tilt settings
    pan_topic: "/pan_controller/command"
    tilt_topic: "/tilt_controller/command"
    
    # Targeting settings
    target_distance_min: 0.5
    target_distance_max: 5.0
    target_height_min: 0.1
    target_height_max: 1.0
    
    # Camera settings
    camera_frame: "camera_frame"
    base_frame: "base_link"
    
    # Processing settings
    update_rate: 10.0  # Hz
    smoothing_factor: 0.3
    
    # Safety settings
    pan_min: -1.57  # -90 degrees
    pan_max: 1.57   # 90 degrees
    tilt_min: -0.785  # -45 degrees
    tilt_max: 0.785   # 45 degrees