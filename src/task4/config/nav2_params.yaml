# Nav2 Parameters for Autonomous Agrar-Roboter (Knicklenker)
# This configuration includes:
# - Local and global costmaps with marker obstacle layer
# - Regulated Pure Pursuit controller for knuckle-steer kinematics
# - Marker safety radius to prevent driving over markers

nav2_controller:
  ros__parameters:
    # Controller server settings
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.1
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # General goal checker
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    # FollowPath controller
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_velocity: 0.3
      max_linear_velocity: 0.5
      min_linear_velocity: 0.1
      desired_angular_velocity: 0.8
      max_angular_velocity: 1.5
      max_angular_acceleration: 1.0
      max_lateral_acceleration: 0.5
      lateral_jerk_penalty: 2.0
      longitudinal_jerk_penalty: 1.0
      obstacle_cost_penalty: 2.0
      min_obstacle_distance: 0.3
      min_obstacle_speed: 0.0
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_dist: 0.3
      inflation_cost_scaling_gain: 1.0
      use_velocity_scaled_lookahead: true
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 1.0
      use_path_cost_regulated_linear_velocity_scaling: false
      path_cost_scale: 0.0
      use_rotational_velocity_regulation: true
      use_jerk_regulated_linear_velocity_scaling: true
      use_velocity_scaled_lookahead: true
      use_obstacle_cost_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      use_path_cost_regulated_linear_velocity_scaling: false
      use_obstacle_cost_regulated_linear_velocity_scaling: true

nav2_planner:
  ros__parameters:
    # Planner server settings
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavFnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

nav2_bt_navigator:
  ros__parameters:
    bt_navigator_plugins:
      - "nav2_compute_path_to_pose_action_bt_node/ComputePathToPoseAction"
      - "nav2_compute_path_through_poses_action_bt_node/ComputePathThroughPosesAction"
      - "nav2_follow_path_action_bt_node/FollowPathAction"
      - "nav2_back_up_action_bt_node/BackUpAction"
      - "nav2_spin_action_bt_node/SpinAction"
      - "nav2_wait_action_bt_node/WaitAction"
      - "nav2_clear_costmap_service_bt_node/ClearCostmapService"
      - "nav2_is_stuck_action_bt_node/IsStuckAction"
      - "nav2_initial_pose_client_bt_node/InitialPoseClient"
      - "nav2_recovery_node_bt_node/RecoveryNode"
      - "nav2_sequence_node_bt_node/SequenceNode"
      - "nav2_selector_node_bt_node/SelectorNode"
      - "nav2_condition_node_bt_node/ConditionNode"
      - "nav2_do_while_node_bt_node/DoWhileNode"

    bt_tree: "file://${FRE2026_Tasks}/src/task4/config/nav2_bt_tree.xml"

    # Lifecycle managers
    lifecycle_node_names:
      - "controller_server"
      - "planner_server"
      - "recoveries_node"
      - "bt_navigator"

nav2_recoveries:
  ros__parameters:
    plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"

nav2_lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - "controller_server"
      - "planner_server"
      - "recoveries_node"
      - "bt_navigator"
      - "velocity_smoother"
      - "velocity_filter"

# Costmap configurations
global_costmap:
  ros__parameters:
    update_frequency: 1.0
    publish_frequency: 1.0
    global_frame: "map"
    robot_base_frame: "base_link"
    use_sim_time: false
    robot_radius: 0.6  # Total robot radius including safety margin
    resolution: 0.05
    track_unknown_space: true
    plugins:
      - {name: static_layer, type: "nav2_costmap_2d::StaticLayer"}
      - {name: obstacle_layer, type: "nav2_costmap_2d::ObstacleLayer"}
      - {name: inflation_layer, type: "nav2_costmap_2d::InflationLayer"}
      - {name: marker_layer, type: "nav2_costmap_2d::ObstacleLayer"}

    static_layer:
      enabled: true
      map_subscribe_transient_local: true
      topic: "/map"

    obstacle_layer:
      enabled: true
      observation_sources: ["scan"]
      scan:
        topic: "/sensors/merged_scan"
        max_obstacle_height: 2.0
        obstacle_range: 2.5
        raytrace_range: 3.0
        inf_is_valid: true
        clearing: true
        marking: true
        data_type: "LaserScan"

    inflation_layer:
      enabled: true
      inflation_radius: 0.8
      cost_scaling_factor: 10.0
      inflate_unknown: false

    marker_layer:
      enabled: true
      observation_sources: ["detected_markers"]
      detected_markers:
        topic: "/detected_markers"
        max_obstacle_height: 0.1
        obstacle_range: 0.5
        raytrace_range: 1.0
        inf_is_valid: false
        clearing: false
        marking: true
        data_type: "PointCloud2"
        # Marker-specific inflation settings
        # Each marker gets a safety radius of 0.3m (30cm) to prevent driving over markers
        # The inflation_layer will create a circular obstacle around each marker
        # based on the inflation_radius parameter
        mark_threshold: 1.0

local_costmap:
  ros__parameters:
    update_frequency: 5.0
    publish_frequency: 5.0
    global_frame: "odom"
    robot_base_frame: "base_link"
    use_sim_time: false
    robot_radius: 0.6  # Total robot radius including safety margin
    resolution: 0.05
    track_unknown_space: false
    plugins:
      - {name: static_layer, type: "nav2_costmap_2d::StaticLayer"}
      - {name: obstacle_layer, type: "nav2_costmap_2d::ObstacleLayer"}
      - {name: inflation_layer, type: "nav2_costmap_2d::InflationLayer"}
      - {name: marker_layer, type: "nav2_costmap_2d::ObstacleLayer"}

    static_layer:
      enabled: false  # Local costmap doesn't need static map

    obstacle_layer:
      enabled: true
      observation_sources: ["scan", "detected_markers"]
      scan:
        topic: "/sensors/merged_scan"
        max_obstacle_height: 2.0
        obstacle_range: 2.5
        raytrace_range: 3.0
        inf_is_valid: true
        clearing: true
        marking: true
        data_type: "LaserScan"
        observation_persistence: 0.0

    marker_layer:
      enabled: true
      observation_sources: ["detected_markers"]
      detected_markers:
        topic: "/detected_markers"
        max_obstacle_height: 0.1
        obstacle_range: 0.5
        raytrace_range: 1.0
        inf_is_valid: false
        clearing: false
        marking: true
        data_type: "PointCloud2"
        # Marker-specific inflation settings
        # Each marker gets a safety radius of 0.3m (30cm) to prevent driving over markers
        # The inflation_layer will create a circular obstacle around each marker
        # based on the inflation_radius parameter
        mark_threshold: 1.0

    inflation_layer:
      enabled: true
      inflation_radius: 0.8
      cost_scaling_factor: 10.0
      inflate_unknown: false

# Velocity smoother and filter
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.5]
    min_velocity: [-0.5, 0.0, -1.5]
    max_accel: [1.0, 0.0, 3.0]
    max_decel: [-1.0, 0.0, -3.0]
    odom_topic: "/odom"
    odom_duration: 1.0

velocity_filter:
  ros__parameters:
    velocity_filter_enabled: true
    min_velocity: 0.05
    max_velocity: 0.5