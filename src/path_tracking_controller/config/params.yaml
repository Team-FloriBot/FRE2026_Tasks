pure_pursuit_node:
  ros__parameters:

    path_topic: "/plan"
    cmd_vel_topic: "/cmd_vel/tasks"
    status_topic: "/pure_pursuit_node/status"

    base_link_frame: "base_link"

    lookahead_min: 0.50
    lookahead_max: 1.00
    lookahead_gain: 0.25

    max_speed: 0.22
    min_speed: 0.08

    curvature_gain: 4.0
    pure_pursuit_gain: 0.65

    max_angular_velocity: 0.65
    min_follow_turn_radius: 0.45
    angular_acceleration_limit: 0.60
    angular_command_filter_alpha: 0.35

    goal_tolerance: 0.15
    slowdown_distance: 0.90

    acceleration_limit: 0.30
    deceleration_limit: 0.40

    control_rate: 20.0

    projection_search_distance: 2.20
    projection_backtrack_distance: 0.15

    heading_filter_enabled: true
    heading_tolerance: 1.35

    final_heading_alignment_enabled: true
    final_heading_tolerance: 0.08
    final_heading_gain: 1.2
    final_heading_min_angular_velocity: 0.08
    final_heading_max_angular_velocity: 0.45
    final_heading_timeout: 8.0
