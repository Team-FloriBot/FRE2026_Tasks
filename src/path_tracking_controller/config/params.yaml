pure_pursuit_node:
  ros__parameters:

    path_topic: "/plan"

    global_frame: "odom"
    base_link_frame: "base_link"

    lookahead_min: 0.25
    lookahead_max: 0.80
    lookahead_gain: 0.15

    max_speed: 0.8
    min_speed: 0.2

    curvature_gain: 3.0
    max_angular_velocity: 3.0

    goal_tolerance: 0.15

    control_rate: 20.0

    search_window: 200

    # --- RESAMPLING ---
    resample_enabled: true
    resample_spacing: 0.10