pure_pursuit_node:
  ros__parameters:

    path_topic: "/plan"
    odom_topic: "/odom"
    cmd_vel_topic: "/cmd_vel"

    global_frame: "map"
    base_link_frame: "base_link"

    lookahead_min: 0.5
    lookahead_max: 2.5
    lookahead_gain: 1.0

    max_speed: 2.0
    min_speed: 0.3

    curvature_gain: 1.5
    max_angular_velocity: 2.0

    goal_slowdown_distance: 2.0
    goal_tolerance: 0.15

    control_rate: 20.0

    search_window: 200