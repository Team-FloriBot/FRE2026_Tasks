front_scan_mux:
  ros__parameters:
    active_profile: "rs_crop_scan"
    front_output_topic: "/laser_scan_mux/front_scan"
    rear_output_topic: "/laser_scan_mux/rear_scan"

    # Input subscribers can be best_effort for common LaserScan drivers.
    # The output is reliable so it matches the current laser_scan_merger scan_policies config.
    input_qos_reliability: "best_effort"
    output_qos_reliability: "reliable"

    profiles:
      rs_crop_scan:
        front_topic: "/sensors/robosense/front/crop_points_2d"
        rear_topic: "/sensors/robosense/rear/crop_points_2d"
      rs_nonground_scan:
        front_topic: "/sensors/robosense/front/nonground_points_2d"
        rear_topic: "/sensors/robosense/rear/nonground_points_2d"
      rs_nonground_scan_torsten:
        front_topic: "/sensors/robosense/front/scan"
        rear_topic: "/sensors/robosense/rear/scan"
      rs_aaron_nonground_scan:
        front_topic: "/sensors/robosense/front/aaron_nonground_points_2d"
        rear_topic: "/sensors/robosense/rear/aaron_nonground_points_2d"
      sick_front:
        front_topic: "/sensors/scan_front"
        rear_topic: "/sensors/scan_rear"
