maize_navigator:
  ros__parameters:
    pattern: "1L-1R-2L-3R"

    # Reihenparameter
    max_dist_in_row: 0.375
    row_width: 0.75
    drive_out_dist: 1.0

    # Geschwindigkeiten
    vel_linear_drive: 0.22
    vel_linear_count: 0.35
    vel_linear_turn: 0.14
    vel_linear_enter_row: 0.12

    # Reihenregler
    # Reduziert gegenüber vorher, damit der Roboter nicht zittert.
    row_center_kp: 1.8
    row_heading_kp: 0.45
    row_forward_kp: 0.55
    row_max_angular: 0.65
    row_min_linear: 0.0
    row_curve_slowdown_gain: 0.65

    # Nahbereichs-Kollisionsvermeidung in der Reihe
    row_clearance_kp: 1.4
    row_slow_clearance: 0.28
    row_emergency_clearance: 0.10
    row_guard_clearance: 0.16
    row_guard_min_angular: 0.25

    # Velocity Ramper
    # Niedrigere Beschleunigungen glätten das Fahrverhalten.
    accel_max_linear: 0.22
    accel_max_angular: 1.2

    # SLAM / TF Frames
    frames:
      map: "map"
      robot_base: "base_link"

    # Reihenende-Erkennung entprellen
    row_end:
      confirm_cycles: 5

    # Reihenerkennung beim seitlichen Vorbeifahren
    row_pass:
      confirm_cycles: 3
      free_cycles: 2
      min_strength: 5
      max_width: 0.45
      fallback_to_slam: true

      # Benötigt den überarbeiteten Python-Code mit row_pass.max_extra_shift.
      # Begrenzung gegen zu weites seitliches Herausfahren:
      # maximal target_row_count * row_width + max_extra_shift.
      max_extra_shift: 0.25

    # TF-Ausfälle tolerieren
    tf:
      missing_max_cycles: 10

    # SLAM-basierte Wende
    turn:
      # Kürzeres Herausfahren aus der Reihe.
      # Vorher 1.0 m; das kann den Roboter unnötig weit ins Vorgewende bringen.
      headland_exit_dist: 0.65

      # Kleinerer Vorhalteabstand vor der neuen Reihe.
      # Vorher 0.3 m; reduziert Überschwingen und Suchweg.
      pre_entry_offset: 0.15

      exit_pos_tolerance: 0.08
      shift_pos_tolerance: 0.08
      pos_tolerance: 0.10
      yaw_tolerance: 0.10

      slowdown_distance: 0.65
      k_heading: 0.9
      k_yaw: 1.0
      max_angular: 0.45

    enter_row:
      confirm_cycles: 5
      max_center_error: 0.20

    perception:
      drive_in_row:
        x_min: 0.0
        x_max: 1.6
        y_min: 0.03
        y_max: 1.0

      turn_and_exit:
        x_min: -0.5
        x_max: 0.5
        y_min: 0.1
        y_max: 1.0

      # Suchfenster beim seitlichen Vorbeifahren.
      # Kleineres y_max verhindert, dass entfernte Objekte oder Nachbarstrukturen
      # als Reihe interpretiert werden.
      counting_rows:
        x_min: -0.35
        x_max: 0.35
        y_min: 0.12
        y_max: 1.05

      turn_to_row:
        x_min: 0.0
        x_max: 1.5
        y_min: 0.1
        y_max: 1.0

    topics:
      laserscan: "/sensors/merged_scan"
      cmd_vel: "/cmd_vel"
      field_points: "/field_points"
