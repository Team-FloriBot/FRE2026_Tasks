maize_navigator:
  ros__parameters:
    # ROS interfaces and frames
    cmd_vel_topic: "/cmd_vel"
    base_frame: "base_link"
    map_frame: "map"
    map_topic: "/map"
    scan_topic: "/sensors/merged_scan"
    control_frequency: 30.0

    # Row geometry
    expected_row_width: 0.75
    min_lane_width: 0.55
    max_lane_width: 1.20
    starting_lane_number: 1
    row_numbers_increase_to: "left"

    # Initial row acquisition from the occupancy map
    hist_roi_size: 5.0
    hist_roi_depth: 4.0
    hist_roi_width: 25.0
    hist_bin_size: 0.05
    hist_peak_min_points: 3
    map_row_occupancy_threshold: 50

    # Rectangle marching row tracking
    row_segment_point_count: 5
    row_segment_point_spacing: 0.30
    row_rectangle_width: 0.6
    row_point_window_length: 0.30
    row_end_min_points_fields_3_to_5: 2
    row_max_march_steps: 120
    row_min_fit_points: 3
    row_freeze_behind_distance: 0.0

    # Local LaserScan row correction
    laser_follow_enabled: true
    laser_scan_timeout: 0.50
    laser_roi_x_min: 0.0
    laser_roi_length: 1.55
    laser_roi_width: 0.65
    laser_roi_center_offset_limit: 0.1
    laser_ransac_iterations: 50
    laser_ransac_distance: 0.08
    laser_min_inliers: 5
    laser_min_visible_length: 0.35
    laser_max_abs_line_slope: 0.90
    laser_max_angle_to_map: 0.45
    laser_max_center_offset: 0.40
    laser_min_confidence: 0.25
    laser_full_confidence: 0.85
    laser_max_weight_both_sides: 0.1
    laser_max_weight_one_side: 0.05
    laser_tracker_alpha: 0.25
    laser_roi_map_correction_weight: 0.20

    # High-carefulness row-following profile.
    # StartNavigation.carefulness=medium/low derives faster runtime profiles from these values.
    follow_speed: 0.50
    slow_speed: 0.12
    lookahead_distance: 0.75
    pose_lateral_gain: 0.3
    pose_heading_gain: 0.35
    pose_curvature_feedforward_gain: 0.1
    pose_lateral_rate_gain: 1.25
    lateral_error_limit: 0.35
    lateral_rate_limit: 0.45
    curve_speed_reduction_gain: 3.0
    lateral_speed_reduction_gain: 4.0
    lateral_rate_speed_reduction_gain: 4.0
    linear_accel_limit: 0.25
    angular_control_speed: 0.25
    ackermann_wheelbase: 1.1
    max_steering_angle: 1.25
    follow_max_angular_speed: 0.65
    min_follow_turn_radius: 0.37
    angular_rate_limit: 1.0
    target_filter_alpha: 0.55

    # Row exit and headland maneuver
    row_end_goal_outward_distance: 0.30
    row_exit_extension_distance: 0.50
    path_goal_xy_tolerance: 0.25
    maneuver_goal_xy_tolerance: 0.25
    maneuver_goal_yaw_tolerance: 0.75
    maneuver_heading_lookahead_distance: 0.10
    maneuver_speed: 0.24
    maneuver_slow_speed: 0.10
    maneuver_lookahead_distance: 0.35
    maneuver_route_spacing: 0.08
    maneuver_corner_radius: 0.37
    maneuver_control_gain_scale: 1.45
    maneuver_max_angular_speed: 1.25
    maneuver_angular_rate_limit: 2.2
    maneuver_entry_extension_distance: 0.80
    maneuver_max_route_deviation: 0.70
    maneuver_entry_lateral_tolerance: 0.25
    maneuver_entry_yaw_tolerance: 0.45

    # Mission
    pattern: "3L 6R 5R 4R 3R 2R 1R"
    row_map_output_directory: "~/.ros/maize_navigation"
    publish_debug: true
