maize_navigator:
  ros__parameters:
    pattern: "1L-1R-2L-3R"

    # Reihenparameter
    max_dist_in_row: 0.375
    row_width: 0.75
    drive_out_dist: 1.0

    # Geschwindigkeiten
    vel_linear_drive: 0.30
    vel_linear_count: 0.5
    vel_linear_turn: 0.25
    vel_linear_enter_row: 0.15

    # Reihenregler
    row_center_kp: 3.4
    row_heading_kp: 0.8
    row_forward_kp: 1.6
    row_max_angular: 1.3
    row_min_linear: 0.0
    row_curve_slowdown_gain: 0.90

    # Nahbereichs-Kollisionsvermeidung in der Reihe
    row_clearance_kp: 2.5
    row_slow_clearance: 0.28
    row_emergency_clearance: 0.10
    row_guard_clearance: 0.16
    row_guard_min_angular: 0.45

    # Velocity Ramper
    accel_max_linear: 0.35
    accel_max_angular: 4.0

    # SLAM / TF Frames
    frames:
      map: "map"
      robot_base: "base_link"

    # Reihenende-Erkennung entprellen
    row_end:
      confirm_cycles: 5

    # Reihenerkennung beim seitlichen Vorbeifahren
    row_pass:
      confirm_cycles: 4
      free_cycles: 3
      min_strength: 6
      max_width: 0.35
      fallback_to_slam: true

    # TF-Ausfälle tolerieren
    tf:
      missing_max_cycles: 10

    # SLAM-basierte Wende
    turn:
      headland_exit_dist: 1.0
      pre_entry_offset: 0.3

      exit_pos_tolerance: 0.10
      shift_pos_tolerance: 0.10
      pos_tolerance: 0.10
      yaw_tolerance: 0.12

      slowdown_distance: 0.80
      k_heading: 1.5
      k_yaw: 1.8
      max_angular: 0.6

    enter_row:
      confirm_cycles: 5
      max_center_error: 0.20

    perception:
      drive_in_row:
        x_min: 0.0
        x_max: 1.6
        y_min: 0.03
        y_max: 1.0

      turn_and_exit:
        x_min: -0.5
        x_max: 0.5
        y_min: 0.1
        y_max: 1.0

      counting_rows:
        x_min: -0.45
        x_max: 0.45
        y_min: 0.15
        y_max: 1.6

      turn_to_row:
        x_min: 0.0
        x_max: 1.5
        y_min: 0.1
        y_max: 1.0

    topics:
      laserscan: "/sensors/merged_scan"
      cmd_vel: "/cmd_vel"
      field_points: "/field_points"
